<!DOCTYPE html>
<html lang="kk">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Cloud Student Tasks</title>
 <style>
   body {
     font-family: Arial, sans-serif;
     background: #f1f5f9;
     margin: 0;
     padding: 30px 16px;
     color: #1e293b;
   }
   .container {
     max-width: 650px;
     margin: auto;
     background: white;
     padding: 25px;
     border-radius: 16px;
     box-shadow: 0 5px 20px #0001;
   }
   h1 { color: #2563eb; }
   .form {
     display: flex;
     gap: 8px;
   }
   input {
     flex: 1;
     min-width: 0;
     padding: 12px;
     border: 1px solid #cbd5e1;
     border-radius: 8px;
   }
   button {
     padding: 10px 14px;
     border: 0;
     border-radius: 8px;
     background: #2563eb;
     color: white;
     cursor: pointer;
   }
   ul { padding: 0; list-style: none; }
   li {
     display: flex;
     align-items: center;
     gap: 10px;
     padding: 12px 0;
     border-bottom: 1px solid #e2e8f0;
   }
   li span { flex: 1; overflow-wrap: anywhere; }
   li.done span {
     text-decoration: line-through;
     color: #64748b;
   }
   .delete { background: #dc2626; }
   .stats { color: #475569; }
 </style>
</head>
<body>
 <main class="container">
   <h1>☁️ Cloud Student Tasks</h1>
   <p>Бұлттық технологиялар бойынша тапсырмалар тізімі</p>
 
   <form id="taskForm" class="form">
     <input id="taskInput"
       placeholder="Жаңа тапсырма енгізіңіз..."
       required maxlength="150">
     <button type="submit">Қосу</button>
   </form>
 
   <p id="stats" class="stats"></p>
   <ul id="taskList"></ul>
 </main>
 
 <script>
   const form = document.getElementById("taskForm");
   const input = document.getElementById("taskInput");
   const list = document.getElementById("taskList");
   const stats = document.getElementById("stats");
 
   let tasks = [
     { text: "GitHub репозиторийін құру", done: true },
     { text: "README.md файлын дайындау", done: false },
     { text: "Сайтты GitHub Pages-ке жариялау", done: false }
   ];
 
   function renderTasks() {
     list.replaceChildren();
 
     tasks.forEach((task, index) => {
       const li = document.createElement("li");
       if (task.done) li.classList.add("done");
 
       const check = document.createElement("input");
       check.type = "checkbox";
       check.checked = task.done;
       check.setAttribute("aria-label", "Орындалды");
 
       check.addEventListener("change", () => {
         tasks[index].done = check.checked;
         renderTasks();
       });
 
       const text = document.createElement("span");
       text.textContent = task.text;
 
       const del = document.createElement("button");
       del.textContent = "Жою";
       del.className = "delete";
 
       del.addEventListener("click", () => {
         tasks.splice(index, 1);
         renderTasks();
       });
 
       li.append(check, text, del);
       list.append(li);
     });
 
     const completed = tasks.filter(t => t.done).length;
     stats.textContent =
       `Барлығы: ${tasks.length} | Орындалды: ${completed}`;
   }
 
   form.addEventListener("submit", event => {
     event.preventDefault();
     const text = input.value.trim();
     if (!text) return;
 
     tasks.push({ text, done: false });
     input.value = "";
     renderTasks();
   });
 
   renderTasks();
 </script>
</body>
</html>
